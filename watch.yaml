# JD-Watch per-check configuration. No magic numbers in code -- every
# interval/threshold lives here. TODO(threshold) markers call out values
# chosen without historical data to calibrate against; revisit once this
# has run for a few weeks.

stop_coverage:
  poll_interval_seconds: 60
  # TODO(threshold): number of consecutive polls before firing. 2 x 60s =
  # 2min grace for a legitimate stop-replace in flight, chosen to loosely
  # mirror JD-Relay's own position_manager.py mismatch_grace_seconds (45s)
  # for reconciliation mismatches -- no dedicated stop-coverage history
  # exists yet to calibrate a tighter/looser number from.
  confirm_polls: 2

flat_by_close:
  # TODO(threshold): order_router.time_exit_et (15:55 ET, JD-Relay's own
  # EOD sweep trigger) + 10min grace for that sweep to actually finish
  # confirming fills before this check starts treating a still-open
  # position as a violation rather than "sweep in progress."
  check_time_et: "16:05"
  realert_interval_seconds: 300

killswitch_dryfire:
  # TODO(threshold): well before RTH open and before options.zero_dte.
  # no_new_entries_after_et (15:00 ET is for the entry cutoff, not
  # relevant here) -- just needs to run once, quietly, pre-market.
  run_time_et: "08:30"
  poll_timeout_seconds: 10
  # Informational only -- killswitch_dryfire.py hardcodes its target list
  # in code (never reads this), specifically so a config typo here can
  # never point the dry-fire test at a live account.
  targets: [tradier_sandbox, alpaca_sandbox]

ops_monitor_runner:
  # TODO(threshold): 30min cadence during the trading day. No cadence
  # currently exists at all (ops_monitor.py is manual-only today), so this
  # is a starting guess, not a measured value.
  interval_seconds_rth: 1800
  timeout_seconds: 120

premarket_report:
  # TODO(threshold): after killswitch_dryfire (08:30) and a couple of
  # ops_monitor_runner cycles have had a chance to run, still well before
  # RTH open (09:30 ET).
  run_time_et: "08:45"
  # TODO(threshold): no historical headroom data yet -- starting guesses,
  # not measured baselines. Revisit once this has run for a few weeks.
  disk_headroom_min_pct: 15.0
  mem_headroom_min_pct: 10.0

mid_session_report:
  # TODO(threshold): hourly during RTH. No existing cadence to anchor
  # this to (this report is entirely new) -- a starting guess.
  interval_seconds: 3600

eod_report:
  # TODO(threshold): flat_by_close's own check_time_et (16:05) + 10min so
  # today's flat-by-close result is already known when this runs.
  run_time_et: "16:15"

weekly_digest:
  # TODO(threshold): after eod_report, Friday only (see weekly.py's run()
  # -- the day-of-week gate lives in code, not here, so a config edit
  # can't accidentally make this fire on the wrong day).
  run_time_et: "16:20"

daily_trade_report:
  run_time_et: "16:16"
  timeout_seconds: 60

trade_validation:
  # After weekly_digest, Friday only (day-of-week gate lives in code, same
  # reasoning as weekly_digest's own note above).
  run_time_et: "16:25"
  timeout_seconds: 60
  doc_path: "TRADE_PERFORMANCE_VALIDATION.md"
  # TODO(threshold): ~30-50 closed trades per product before a win-rate/
  # P&L number stops being mostly noise -- 30 as the conservative floor.
  # No measured calibration yet; revisit once live accounts have real
  # volume to check this against.
  sample_size_floor: 30

alerting:
  base_dedupe_window_seconds: 300
  max_dedupe_window_seconds: 7200
